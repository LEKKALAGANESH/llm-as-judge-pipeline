[project]
name = "llm-as-judge-pipeline"
version = "1.0.0"
description = "LLM-as-judge evaluation pipeline with measured bias mitigation and judge validation."
# 3.11, not 3.10. The pinned scientific stack sets the real floor: both
# scikit-learn 1.8.0 and scipy 1.17.0 declare Requires-Python >=3.11, so a 3.10
# install cannot resolve and the CI job for it could never have passed.
# Declaring a floor the dependency set does not support is a claim, not a
# capability -- the honest move is to state the version that actually works.
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "logs", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # typer uses function calls in argument defaults by design
    "SIM108", # ternaries are not always clearer than an if/else here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real provider API and consumes free-tier quota (deselected in CI)",
]
