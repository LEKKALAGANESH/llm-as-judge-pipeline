<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1486" viewBox="0 0 1400 1486" font-family="Segoe UI, Inter, system-ui, sans-serif">
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
</marker>
</defs>
<rect width="1400" height="0" fill="#ffffff"/>
<text x="700.0" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">LLM-as-Judge Evaluation Pipeline</text>
<text x="700.0" y="71" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">judge: groq/llama-3.3-70b-versatile (Llama family)  -  candidates: groq/openai/gpt-oss-120b (OpenAI family)  -  cross-family by invariant</text>
<text x="700.0" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7e22ce">purple dashed = bias mitigation applied here</text>
<rect x="195.0" y="120" width="470" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1. Test suite input  (JSON)</text>
<text x="430.0" y="170" text-anchor="middle" font-size="13" fill="#475569">{ input, system_prompt, model_output,</text>
<text x="430.0" y="189" text-anchor="middle" font-size="13" fill="#475569">expected_output?, criteria? }  -  15 cases</text>
<rect x="195.0" y="246" width="470" height="122" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="273" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2. Judging-prompt construction</text>
<text x="430.0" y="296" text-anchor="middle" font-size="13" fill="#475569">rubric.yaml -&gt; 6 criteria, 1-5 integer scale</text>
<text x="430.0" y="315" text-anchor="middle" font-size="13" fill="#475569">1/3/5 anchors pin what each score level means</text>
<text x="430.0" y="334" text-anchor="middle" font-size="13" fill="#475569">anti-verbosity clause; rationale-before-score</text>
<text x="430.0" y="353" text-anchor="middle" font-size="13" fill="#475569">candidate text sealed in &lt;output id="{nonce}"&gt;</text>
<line x1="430" y1="210" x2="430" y2="240" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="940" y="252" width="420" height="52" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1150.0" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">MITIGATION - verbosity + anchoring</text>
<text x="1150.0" y="292" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">anti_verbosity_clause  -  few_shot_anchors  -  rationale_first</text>
<path d="M671.0,278 L934,278" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<rect x="195.0" y="408" width="470" height="122" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="435" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3. Judge model API call</text>
<text x="430.0" y="458" text-anchor="middle" font-size="13" fill="#475569">T = 0.0  -  max_tokens 2048  -  structured output</text>
<text x="430.0" y="477" text-anchor="middle" font-size="13" fill="#475569">transient-only retry: 429 / 5xx / connection, 6 attempts</text>
<text x="430.0" y="496" text-anchor="middle" font-size="13" fill="#475569">auth / permission / bad-request are never retried</text>
<text x="430.0" y="515" text-anchor="middle" font-size="13" fill="#475569">every call appended to logs/verdicts.jsonl</text>
<line x1="430" y1="372" x2="430" y2="402" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="195.0" y="576" width="470" height="104" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="603" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">4. Structured-verdict parsing</text>
<text x="430.0" y="626" text-anchor="middle" font-size="13" fill="#475569">pydantic schema validation</text>
<text x="430.0" y="645" text-anchor="middle" font-size="13" fill="#475569">scores must be integers in [1, 5]</text>
<text x="430.0" y="664" text-anchor="middle" font-size="13" fill="#475569">`passed` computed in code, never self-declared</text>
<line x1="430" y1="534" x2="430" y2="570" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<polygon points="430,717.0 665.0,782 430,847.0 195.0,782" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="430" y="778" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">valid JSON and schema ?</text>
<text x="430" y="796" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">up to max_repair_attempts = 3</text>
<line x1="430" y1="684" x2="430" y2="711" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="940" y="726" width="420" height="118" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="1150.0" y="753" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">MALFORMED -&gt; repair, not retry</text>
<text x="1150.0" y="776" text-anchor="middle" font-size="13" fill="#475569">Re-sending the same prompt is a re-issue.</text>
<text x="1150.0" y="795" text-anchor="middle" font-size="13" fill="#475569">The repair turn appends the malformed text</text>
<text x="1150.0" y="814" text-anchor="middle" font-size="13" fill="#475569">AND the validator's complaint, so the model</text>
<text x="1150.0" y="833" text-anchor="middle" font-size="13" fill="#475569">is answering a new, more specific question.</text>
<path d="M665,782 L934,782" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#tip)"/>
<text x="802.5" y="770" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">invalid</text>
<path d="M1150.0,726 L1150.0,690 L430,690 L430,711" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#tip)"/>
<text x="790.0" y="682" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">re-ask with the error attached</text>
<rect x="940" y="868" width="420" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="1150.0" y="895" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">attempts exhausted -&gt; EXCLUDED</text>
<text x="1150.0" y="918" text-anchor="middle" font-size="13" fill="#475569">Recorded as a failure with its reason.</text>
<text x="1150.0" y="937" text-anchor="middle" font-size="13" fill="#475569">Never silently dropped and never coerced</text>
<text x="1150.0" y="956" text-anchor="middle" font-size="13" fill="#475569">into a default score.</text>
<path d="M1150.0,844 L1150.0,862" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="195.0" y="893" width="470" height="150" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="430.0" y="920" text-anchor="middle" font-size="16" font-weight="700" fill="#581c87">5. Pairwise A/B  -  POSITION SWAP HAPPENS HERE</text>
<text x="430.0" y="943" text-anchor="middle" font-size="13" fill="#475569">forward:  judge(A, B)          reverse: judge(B, A)</text>
<text x="430.0" y="962" text-anchor="middle" font-size="13" fill="#475569">reverse winner remapped back into the (A, B) frame</text>
<text x="430.0" y="981" text-anchor="middle" font-size="13" fill="#475569">agree    -&gt; that winner, position_consistent = True</text>
<text x="430.0" y="1000" text-anchor="middle" font-size="13" fill="#475569">disagree -&gt; POSITION_INCONSISTENT (counts as a tie)</text>
<text x="430.0" y="1019" text-anchor="middle" font-size="13" fill="#475569">either order fails -&gt; pair excluded from win/loss AND</text>
<text x="430.0" y="1038" text-anchor="middle" font-size="13" fill="#475569">from the flip-rate denominator</text>
<line x1="430" y1="851" x2="430" y2="887" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="940" y="1004" width="420" height="52" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1150.0" y="1025" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">MITIGATION - position bias (order_swap)</text>
<text x="1150.0" y="1044" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">src/mitigations.py  -  invoked once, from one place</text>
<path d="M671.0,1030 L934,1030" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<rect x="195.0" y="1083" width="470" height="126" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="1110" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">6. Per-case aggregation</text>
<text x="430.0" y="1133" text-anchor="middle" font-size="13" fill="#475569">Step 0  coverage gate: &gt;= 50% of cases must complete</text>
<text x="430.0" y="1152" text-anchor="middle" font-size="13" fill="#475569">Step 1  validity gate: flip rate &lt;= 0.20, else no winner</text>
<text x="430.0" y="1171" text-anchor="middle" font-size="13" fill="#475569">Step 2  effect: pairwise win rate &gt;= 0.55</text>
<text x="430.0" y="1190" text-anchor="middle" font-size="13" fill="#475569">pass = overall &gt;= 4 AND min(criterion) &gt;= 3</text>
<line x1="430" y1="1047" x2="430" y2="1077" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="195.0" y="1249" width="470" height="126" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="430.0" y="1276" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">7. Suite report</text>
<text x="430.0" y="1299" text-anchor="middle" font-size="13" fill="#475569">results/suite_report.json  -  ab_comparison_report.json</text>
<text x="430.0" y="1318" text-anchor="middle" font-size="13" fill="#475569">Wilson intervals, bootstrap CIs, quadratic-weighted kappa</text>
<text x="430.0" y="1337" text-anchor="middle" font-size="13" fill="#475569">Wilcoxon / exact McNemar, Holm-Bonferroni corrected</text>
<text x="430.0" y="1356" text-anchor="middle" font-size="13" fill="#475569">replay rebuilds the report from the log alone and diffs it</text>
<line x1="430" y1="1213" x2="430" y2="1243" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="940" y="1090" width="420" height="352" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="1150.0" y="1117" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Judge validation  (separate commands)</text>
<text x="1150.0" y="1140" text-anchor="middle" font-size="13" fill="#475569">validate-judge</text>
<text x="1150.0" y="1159" text-anchor="middle" font-size="13" fill="#475569">   quadratic-weighted kappa vs human gold labels</text>
<text x="1150.0" y="1178" text-anchor="middle" font-size="13" fill="#475569">   test-retest at T=0.7 over 5 runs</text>
<text x="1150.0" y="1197" text-anchor="middle" font-size="13" fill="#475569">   adversarial probe pass rate</text>
<text x="1150.0" y="1216" text-anchor="middle" font-size="13" fill="#475569"></text>
<text x="1150.0" y="1235" text-anchor="middle" font-size="13" fill="#475569">measure-self-enhancement</text>
<text x="1150.0" y="1254" text-anchor="middle" font-size="13" fill="#475569">   same pairs judged cross-family and same-family;</text>
<text x="1150.0" y="1273" text-anchor="middle" font-size="13" fill="#475569">   the win-rate delta IS the estimate</text>
<text x="1150.0" y="1292" text-anchor="middle" font-size="13" fill="#475569"></text>
<text x="1150.0" y="1311" text-anchor="middle" font-size="13" fill="#475569">run-ablation</text>
<text x="1150.0" y="1330" text-anchor="middle" font-size="13" fill="#475569">   every ablatable mitigation on and off,</text>
<text x="1150.0" y="1349" text-anchor="middle" font-size="13" fill="#475569">   emitting the before/after bias table</text>
<text x="1150.0" y="1368" text-anchor="middle" font-size="13" fill="#475569"></text>
<text x="1150.0" y="1387" text-anchor="middle" font-size="13" fill="#475569">gate  -  blocks on flip rate and probe regression</text>
<text x="1150.0" y="1406" text-anchor="middle" font-size="13" fill="#475569">   against a Wilson lower bound; exits 1 for CI</text>
</svg>
