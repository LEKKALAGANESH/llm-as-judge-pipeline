name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        # Live-API tests are deselected here. They consume free-tier quota and
        # would make CI depend on two external providers staying up; run them
        # locally with `pytest -m live` before submitting.
        run: pytest -m "not live" -q

      - name: Secret scan
        # Cheap belt-and-braces on top of .gitignore: fail if anything that
        # looks like a provider key was committed.
        run: |
          if git grep -nIE '(AIza[0-9A-Za-z_-]{30,}|gsk_[0-9A-Za-z]{20,}|sk-[0-9A-Za-z]{20,})' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::possible API key committed"
            exit 1
          fi
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked; it must be gitignored"
            exit 1
          fi
